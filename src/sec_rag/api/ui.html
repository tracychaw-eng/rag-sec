<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rag-sec — SEC 10-K Q&amp;A</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1a1d21; --muted: #6b7280;
    --accent: #2563eb; --accent-text: #ffffff; --border: #e2e5ea;
    --user-bubble: #2563eb; --user-text: #ffffff; --bot-bubble: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101318; --panel: #181c23; --text: #e8eaed; --muted: #9aa2ad;
      --accent: #3b82f6; --accent-text: #ffffff; --border: #2a3038;
      --user-bubble: #2f6feb; --user-text: #ffffff; --bot-bubble: #181c23;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 12px 20px; background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; font-weight: 650; }
  header .sub { color: var(--muted); font-size: 13px; flex: 1; min-width: 200px; }
  header input {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; font-size: 13px; width: 130px;
  }
  header button {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer;
  }
  header button:hover { color: var(--text); }
  #chat {
    flex: 1; overflow-y: auto; padding: 24px 0;
  }
  .inner { max-width: 780px; margin: 0 auto; padding: 0 20px; }
  .msg { margin-bottom: 18px; display: flex; flex-direction: column; }
  .msg.user { align-items: flex-end; }
  .bubble {
    max-width: 85%; padding: 10px 14px; border-radius: 14px;
    white-space: pre-wrap; overflow-wrap: break-word;
  }
  .user .bubble { background: var(--user-bubble); color: var(--user-text); border-bottom-right-radius: 4px; }
  .bot .bubble {
    background: var(--bot-bubble); border: 1px solid var(--border);
    border-bottom-left-radius: 4px; max-width: 100%; width: 100%;
  }
  .meta { font-size: 12px; color: var(--muted); margin-top: 6px; padding-left: 4px; }
  .meta .chip {
    display: inline-block; border: 1px solid var(--border); border-radius: 999px;
    padding: 1px 8px; margin: 2px 4px 0 0; background: var(--panel);
  }
  .thinking { color: var(--muted); font-style: italic; }
  footer {
    background: var(--panel); border-top: 1px solid var(--border); padding: 14px 20px 18px;
  }
  form { max-width: 780px; margin: 0 auto; display: flex; gap: 10px; }
  #q {
    flex: 1; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 12px;
    padding: 11px 14px; font-size: 15px; font-family: inherit; resize: none;
  }
  #q:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  #send {
    background: var(--accent); color: var(--accent-text); border: none;
    border-radius: 12px; padding: 0 22px; font-size: 15px; font-weight: 600;
    cursor: pointer;
  }
  #send:disabled { opacity: .5; cursor: default; }
  .hint { max-width: 780px; margin: 8px auto 0; font-size: 12px; color: var(--muted); }
  .hint a { color: var(--accent); text-decoration: none; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>rag-sec</h1>
  <span class="sub">Ask about the 10-K filings of MSFT, NVDA, JPM (2 fiscal years each)</span>
  <input id="apikey" placeholder="API key" title="X-API-Key">
  <button id="reset" title="Clear conversation">New chat</button>
</header>

<div id="chat"><div class="inner" id="msgs"></div></div>

<footer>
  <form id="f">
    <textarea id="q" rows="1" placeholder="e.g. What was NVIDIA's total revenue in its most recent fiscal year?"></textarea>
    <button id="send" type="submit">Ask</button>
  </form>
  <div class="hint">
    Try: <a data-q="How do Microsoft and JPMorgan differ in how they describe cybersecurity risk?">compare companies</a> ·
    <a data-q="What was Microsoft's total revenue in fiscal year 2025?">table figures</a> ·
    <a data-q="According to the fiscal 2024 10-K, what were Microsoft's main AI risks?">a specific year</a> ·
    follow-ups like “how does that compare to NVIDIA?”
  </div>
</footer>

<script>
const msgs = document.getElementById("msgs");
const chatEl = document.getElementById("chat");
const form = document.getElementById("f");
const qEl = document.getElementById("q");
const sendBtn = document.getElementById("send");
const keyEl = document.getElementById("apikey");

keyEl.value = localStorage.getItem("secrag_key") || "dev-key";
keyEl.addEventListener("change", () => localStorage.setItem("secrag_key", keyEl.value));

let session = "ui-" + Math.random().toString(36).slice(2, 10);
document.getElementById("reset").onclick = () => {
  fetch(`/chat/${session}`, { method: "DELETE", headers: { "X-API-Key": keyEl.value } }).catch(() => {});
  session = "ui-" + Math.random().toString(36).slice(2, 10);
  msgs.innerHTML = "";
  qEl.focus();
};

document.querySelectorAll(".hint a").forEach(a =>
  a.addEventListener("click", () => { qEl.value = a.dataset.q; qEl.focus(); }));

function add(role, text) {
  const m = document.createElement("div");
  m.className = "msg " + role;
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  m.appendChild(b);
  msgs.appendChild(m);
  chatEl.scrollTop = chatEl.scrollHeight;
  return m;
}

function setMeta(msgEl, done, meta) {
  let el = msgEl.querySelector(".meta");
  if (!el) { el = document.createElement("div"); el.className = "meta"; msgEl.appendChild(el); }
  const chips = [];
  if (meta && meta.intent) chips.push(meta.intent);
  if (done && done.contexts) {
    const seen = new Set();
    for (const c of done.contexts) {
      const label = `${c.ticker} Item ${c.item}`;
      if (!seen.has(label)) { seen.add(label); chips.push(label); }
    }
  }
  let tail = "";
  if (done) tail = ` ${(done.latency_ms / 1000).toFixed(1)}s · $${(done.cost_usd ?? 0).toFixed(4)}`;
  el.innerHTML = chips.map(c => `<span class="chip">${c}</span>`).join("") + tail;
}

async function ask(question) {
  add("user", question);
  const botMsg = add("bot", "");
  const bubble = botMsg.querySelector(".bubble");
  bubble.innerHTML = '<span class="thinking">retrieving…</span>';
  sendBtn.disabled = true;

  let meta = null, answer = "";
  try {
    const resp = await fetch(`/chat/${session}/stream`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-API-Key": keyEl.value },
      body: JSON.stringify({ question }),
    });
    if (!resp.ok) {
      const detail = (await resp.json().catch(() => ({}))).detail || resp.statusText;
      bubble.textContent = `Error ${resp.status}: ${detail}`;
      return;
    }
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const block = buf.slice(0, idx); buf = buf.slice(idx + 2);
        const dataLine = block.split("\n").find(l => l.startsWith("data: "));
        if (!dataLine) continue;
        const evt = JSON.parse(dataLine.slice(6));
        if (evt.type === "meta") { meta = evt; setMeta(botMsg, null, meta); }
        else if (evt.type === "delta") {
          answer += evt.text;
          bubble.textContent = answer;
          chatEl.scrollTop = chatEl.scrollHeight;
        }
        else if (evt.type === "done") { setMeta(botMsg, evt, meta); }
      }
    }
    if (!answer) bubble.textContent = "(no answer)";
  } catch (e) {
    bubble.textContent = "Request failed: " + e.message + " — is the stack running? (docker compose up -d)";
  } finally {
    sendBtn.disabled = false;
    qEl.focus();
  }
}

form.addEventListener("submit", e => {
  e.preventDefault();
  const q = qEl.value.trim();
  if (!q || sendBtn.disabled) return;
  qEl.value = "";
  ask(q);
});
qEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});
qEl.focus();
</script>
</body>
</html>
