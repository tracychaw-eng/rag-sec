name: Nightly Eval

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC daily
  workflow_dispatch:

jobs:
  full-ragas:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]" ragas datasets langchain-openai
      - name: Sync corpus from SEC EDGAR (download + ingest)
        run: python -m sec_rag.ingestion.sync MSFT NVDA JPM --years 2
      # dev split only: thresholds are tuned on dev. The holdout split is
      # reserved for release evaluation (run manually:
      # python -m eval.run_secrag --label release-X --split holdout).
      - name: Full eval + RAGAS (dev split)
        run: python -m eval.run_secrag --label nightly --split dev
      - name: Threshold gate
        run: python -m eval.check_thresholds --label nightly
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-eval-${{ github.run_id }}
          path: |
            eval/metrics_nightly.json
            eval/results_nightly.json
      # Optional Slack alert — set the SLACK_WEBHOOK_URL secret to enable
      - name: Alert on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -s -X POST "$SLACK_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"text\": \"sec-rag nightly eval FAILED: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          else
            echo "No SLACK_WEBHOOK_URL secret — relying on GitHub's own failure notification."
          fi
