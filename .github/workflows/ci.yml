name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests eval
      - name: Unit tests
        # python -m puts the repo root on sys.path (the eval/ package is
        # repo-local, not installed)
        run: python -m pytest tests/unit -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sec-rag:ci .

  # Publish to GHCR on every push to master: :latest + :<sha>
  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [lint-and-test, docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          IMAGE=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"

  # Full pipeline smoke: downloads filings from EDGAR, ingests (embeds),
  # and runs the eval smoke gate. Costs a few cents in API calls, so it
  # only runs on manual dispatch and requires repo secrets.
  eval-smoke-gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Sync corpus from SEC EDGAR (download + ingest)
        run: python -m sec_rag.ingestion.sync MSFT NVDA JPM --years 2
      - name: Run smoke gate
        run: python -m eval.smoke_gate
