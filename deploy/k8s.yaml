# Kubernetes deployment for sec-rag.
#
# Prerequisites:
#   kubectl create namespace sec-rag
#   kubectl -n sec-rag create secret generic sec-rag-keys \
#     --from-literal=OPENAI_API_KEY=... \
#     --from-literal=COHERE_API_KEY=... \
#     --from-literal=SECRAG_API_KEYS=...
#   A PVC (sec-rag-corpus) pre-populated with data/store + qdrant_db —
#   run the ingestion job below (or copy from a build machine).
#
# Scale-out: the API talks to a Qdrant SERVER (no file lock) and Redis
# (shared caches/sessions/rate limits), so replicas > 1 is safe. The
# chunk-store volume is read-only at serving time and mounts ReadOnlyMany.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: sec-rag-api
  namespace: sec-rag
spec:
  replicas: 2
  selector:
    matchLabels: {app: sec-rag-api}
  template:
    metadata:
      labels: {app: sec-rag-api}
    spec:
      containers:
        - name: api
          # Published by the CI publish-image job on pushes to master
          image: ghcr.io/OWNER/rag-sec:latest   # <- set your org/repo
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef: {name: sec-rag-keys}
          env:
            - name: SECRAG_REDIS_URL
              value: redis://sec-rag-redis:6379/0
            - name: SECRAG_QDRANT_URL
              value: http://sec-rag-qdrant:6333
            # - name: SECRAG_JUDGE_SAMPLE_RATE
            #   value: "0.05"
            # - name: OTEL_EXPORTER_OTLP_ENDPOINT
            #   value: http://otel-collector.observability:4318
          volumeMounts:
            - {name: corpus, mountPath: /app/data/store, subPath: store,
               readOnly: true}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 2Gi}
      volumes:
        - name: corpus
          persistentVolumeClaim: {claimName: sec-rag-corpus}
---
apiVersion: v1
kind: Service
metadata:
  name: sec-rag-api
  namespace: sec-rag
spec:
  selector: {app: sec-rag-api}
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sec-rag-redis
  namespace: sec-rag
spec:
  replicas: 1
  selector:
    matchLabels: {app: sec-rag-redis}
  template:
    metadata:
      labels: {app: sec-rag-redis}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: sec-rag-redis
  namespace: sec-rag
spec:
  selector: {app: sec-rag-redis}
  ports:
    - port: 6379
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sec-rag-corpus
  namespace: sec-rag
spec:
  accessModes: [ReadWriteMany]   # read-only mounts across api replicas
  resources:
    requests: {storage: 2Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sec-rag-qdrant
  namespace: sec-rag
spec:
  replicas: 1
  selector:
    matchLabels: {app: sec-rag-qdrant}
  template:
    metadata:
      labels: {app: sec-rag-qdrant}
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:latest
          ports:
            - containerPort: 6333
          volumeMounts:
            - {name: qdrant-data, mountPath: /qdrant/storage}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
      volumes:
        - name: qdrant-data
          persistentVolumeClaim: {claimName: sec-rag-qdrant-data}
---
apiVersion: v1
kind: Service
metadata:
  name: sec-rag-qdrant
  namespace: sec-rag
spec:
  selector: {app: sec-rag-qdrant}
  ports:
    - port: 6333
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sec-rag-qdrant-data
  namespace: sec-rag
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 5Gi}
