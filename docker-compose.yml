# Local/single-host deployment: API + Redis + Qdrant server.
#
#   docker compose up --build
#   # first time: ingest into the server from the host
#   $env:SECRAG_QDRANT_URL='http://localhost:6333'; python -m sec_rag.ingestion.sync --years 2
#   # or migrate existing embedded vectors without re-embedding:
#   python -m sec_rag.ingestion.migrate_qdrant --to http://localhost:6333
#
# With Qdrant as a server (no file lock) plus Redis-backed caches/sessions/
# rate limits, the API scales horizontally:
#   docker compose up --scale api=2   (add a load balancer for a single port)

services:
  api:
    build: .
    image: sec-rag:local
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      COHERE_API_KEY: ${COHERE_API_KEY}
      SECRAG_API_KEYS: ${SECRAG_API_KEYS:-dev-key}
      SECRAG_REDIS_URL: redis://redis:6379/0
      SECRAG_QDRANT_URL: http://qdrant:6333
      # SECRAG_JUDGE_SAMPLE_RATE: "0.05"
      # OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY: set to enable Langfuse
    volumes:
      - ./data/store:/app/data/store
    depends_on:
      - redis
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    # No host port — internal only. Uncomment to inspect from the host:
    # ports: ["6379:6379"]

volumes:
  qdrant_data:
